<!DOCTYPE html>
<html lang="en">

<body>
    <!-- ==================== INTRO (PAGE 1) ==================== -->

        <!-- Factory Background -->
        <img src="Element 2-20260302T033547Z-1-001/Element 2/GIF LOADING/tablet/Asset 8_tab.png" class="intro-bg-img"

        <!-- Header: GE Vernova logo (center) -->

            <img src="Element 2-20260302T033547Z-1-001/Element 2/GIF LOADING/tablet/Asset 4_tab.png"
                class="intro-header-logo" alt="GE Vernova">
        </div>

        <div class="intro-content">
            <!-- Big SUSTAINABILITY text -->
            <img src="Element 2-20260302T033547Z-1-001/Element 2/GIF LOADING/tablet/Asset 5_tab.png"
                class="intro-sustainability-img" alt="SUSTAINABILITY">

            <!-- Touch the screen text -->
            <img src="Element 2-20260302T033547Z-1-001/Element 2/GIF LOADING/tablet/Asset 6_tab.png"
                class="intro-touch-img" alt="Touch the screen">

        <!-- Navigation bar placeholder (will be interactive later) -->
        <div class="nav-bar-container">
            <div class="nav-pill">
                <img src="Button-20260225T045112Z-1-001/Button/Asset 18.png" class="nav-pill-bg" alt="">

                <button class="nav-btn" data-action="home" title="Home"></button>
                <button class="nav-btn" data-action="forward" title="Forward"></button>
            </div>
        </div>
    </section>

    <!-- ==================== WHEEL INTRO (PAGE 2) ==================== -->

        <img src="Element 2-20260302T033547Z-1-001/Element 2/GIF LOADING/tablet/Asset 8_tab.png" class="intro-bg-img"
            style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;z-index:1;display:block;max-width:none;"
            alt="Factory Background">

        <!-- Header: GE Vernova logo (center) -->
        <div class="intro-header">
            <img src="Element 2-20260302T033547Z-1-001/Element 2/GIF LOADING/tablet/Asset 4_tab.png"

        </div>

        <!-- Central White Overlay Container -->
        <div class="wheel-intro-overlay-container">

                <!-- Full Wheel -->
                <img src="Element 2-20260302T033547Z-1-001/Element 2/GIF LOADING/tablet/Asset 14_tab.png"

                <!-- Touch the screen text -->
                <img src="Element 2-20260302T033547Z-1-001/Element 2/GIF LOADING/tablet/Asset 6_tab.png"

        <!-- Navigation bar -->

            <div class="nav-pill">

    <!-- ==================== FIND OUT MORE (PAGE 3) ==================== -->

        <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 20tab.png" class="findout-bg-img"

            alt="Background">

        <div class="findout-content">
            <!-- "Find out more about Sustainability at GE Vernova" text image -->
            <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 7tab.png" class="findout-title-img"
                alt="Find out more about Sustainability at GE Vernova">

            <!-- Wheel -->
            <img src="Element 2-20260302T033547Z-1-001/Element 2/GIF LOADING/tablet/Asset 14_tab.png"

            <!-- Touch the screen -->
            <img src="Element 2-20260302T033547Z-1-001/Element 2/GIF LOADING/tablet/Asset 6_tab.png"

        <!-- Navigation bar -->
        <div class="nav-bar-container findout-nav">
            <div class="nav-pill">

                <button class="nav-btn" data-action="forward" title="Forward"></button>
            </div>

    <!-- ==================== HOME PAGE ==================== -->
    <section id="page-home" class="page">
        <div class="home-container"
            style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;">
            <div class="home-canvas" style="position:relative;width:100%;height:100%;">

                <!-- BG -->
                <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 20tab.png" alt="Background"
                    style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;z-index:1;display:block;">

                <!-- Panels (Asset 22) - Centered and scaled to exact original ratio -->
                <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 22tab.png" alt="Pillar Panels"
                    style="position:absolute;left:50%;top:calc(43.7% + 5px);transform:translate(-50%,-50%);width:80%;height:auto;z-index:2;display:block;">

                <!-- Glow circle -->
                <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 29tab.png" alt="Center Glow"
                    style="position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:30%;height:auto;z-index:3;display:block;">

                <!-- Inner wheel -->
                <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 23tab.png" alt="Inner Wheel"
                    style="position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:21%;height:auto;z-index:4;display:block;">

                <!-- Arcs -->
                <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 25tab.png" class="home-arc"
                    data-pillar="electrify" alt="Electrify"
                    style="position:absolute;right:50%;bottom:55%;width:13.5%;height:auto;z-index:5;display:block;cursor:pointer;">
                <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 26tab.png" class="home-arc"
                    data-pillar="decarbonize" alt="Decarbonize"
                    style="position:absolute;left:50%;bottom:55%;width:13.5%;height:auto;z-index:5;display:block;cursor:pointer;">
                <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 28tab.png" class="home-arc"
                    data-pillar="conserve" alt="Conserve"
                    style="position:absolute;right:50%;top:45%;width:13.5%;height:auto;z-index:5;display:block;cursor:pointer;">
                <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 27tab.png" class="home-arc"
                    data-pillar="thrive" alt="Thrive"
                    style="position:absolute;left:50%;top:45%;width:13.5%;height:auto;z-index:5;display:block;cursor:pointer;">

                <!-- Center icons -->
                <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 10tab.png" alt="Center Icons"
                    style="position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:15.5%;height:auto;z-index:7;display:block;pointer-events:none;">

                <!-- Select text -->
                <img src="Element 2-20260302T033547Z-1-001/Element 2/HOME/Tablet/Asset 21tab.png" alt="Select Prompt"
                    style="position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:20%;height:auto;z-index:8;display:block;pointer-events:none;">
            </div>

        <div class="nav-bar-container home-nav-bar">
            <div class="nav-pill">
                <img src="Button-20260225T045112Z-1-001/Button/Asset 18.png" class="nav-pill-bg" alt="">

                <button class="nav-btn" data-action="home" title="Home"></button>
                <button class="nav-btn" data-action="forward" title="Forward"></button>
            </div>
        </div>

    <!-- ==================== ELECTRIFY (PILLAR 1) ==================== -->
    <section id="page-electrify" class="page">
        <div style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;">
            <div class="electrify-canvas" style="position:relative;width:100%;height:100%;">

                <!-- BG: Asset 24 (fullscreen) -->
                <img src="Element 2-20260302T033547Z-1-001/Element 2/PILLAR 1/Tablet/Asset 24_tab.png"
                    alt="Electrify Background"
                    style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;z-index:1;">

                <!-- Wheel Quarter: Asset 25 (bottom-right, flush) -->
                <img src="Element 2-20260302T033547Z-1-001/Element 2/PILLAR 1/Tablet/Asset 25_tab.png"
                    alt="Electrify Wheel"
                    style="position:absolute;right:-2%;bottom:-2%;width:36%;height:auto;z-index:2;">

                <!-- Content Sub-pages -->
                <div id="electrify-content" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;">

                    <!-- Sub-page 1/3: Summary -->
                    <div class="pillar-subpage active" data-subpage="0">
                        <!-- Combined overlay (1/3 + progress): Asset 26 from Pillar 1 -->
                        <img src="1x/tab 1.png" alt="Page 1/3"
                            style="position:absolute;left:3.5%;top:11%;width:1130px;height:auto;z-index:5;">
                    </div>

                    <!-- Sub-page 2/3: Goal 1 -->
                    <div class="pillar-subpage" data-subpage="1">
                        <!-- Combined overlay (Goal 1 + 2/3 + progress): Asset 33 from Pillar 1 -->
                        <img src="Element 2-20260302T033547Z-1-001/Element 2/PILLAR 1/Tablet/Asset 33_tab.png"
                            alt="Page 2/3"
                            style="position:absolute;left:3.5%;top:11%;width:1130px;height:auto;z-index:5;">
                    </div>

                    <!-- Sub-page 3/3: Goal 2 -->
                    <div class="pillar-subpage" data-subpage="2">
                        <!-- Combined overlay (Goal 2+3 + 3/3 + progress): Asset 37 from Pillar 1 -->
                        <img src="Element 2-20260302T033547Z-1-001/Element 2/PILLAR 1/Tablet/Asset 37_tab.png"
                            alt="Page 3/3"
                            style="position:absolute;left:3.5%;top:11%;width:1156px;height:auto;z-index:5;">
                    </div>

                </div>
            </div>
        </div>

        <!-- Navigation bar with Asset 16tab background -->
        <div class="nav-bar-container">
            <div class="nav-pill">
                <img src="Button-20260225T045112Z-1-001/Button/Asset 18.png" class="nav-pill-bg" alt="">
                <button class="nav-btn" data-action="back" title="Back"></button>
                <button class="nav-btn" data-action="home" title="Home"></button>
                <button class="nav-btn" data-action="forward" title="Forward"></button>
            </div>
        </div>
    </section>

                    style="position:absolute;left:-2%;bottom:-2%;width:36%;height:auto;z-index:2;">

                <!-- Content Sub-pages -->

                    <!-- Sub-page 1/3: Summary -->

                        <img src="Element 2-20260302T033547Z-1-001/Element 2/PILLAR 2/Tablet/Asset 25_pl2t.png"

                    </div>

                    <!-- Sub-page 2/3: Goal 1 -->
                    <div class="pillar-subpage" data-subpage="1">
                        <!-- Combined overlay: Asset 28 from Pillar 2 -->
                        <img src="Element 2-20260302T033547Z-1-001/Element 2/PILLAR 2/Tablet/Asset 28_pl2t.png"
                            alt="Page 2/3"
                            style="position:absolute;right:2%;top:calc(10% + 10px);width:59%;height:auto;z-index:5;">
                        <!-- Progress indicator: Asset 26 -->
                        <img src="Element 2-20260302T033547Z-1-001/Element 2/PILLAR 2/Tablet/Asset 27_pl2t.png"

                    </div>

                    <!-- Sub-page 3/3: Goal 2 -->

                        <!-- Combined overlay: Asset 29 from Pillar 2 -->
                        <img src="Element 2-20260302T033547Z-1-001/Element 2/PILLAR 2/Tablet/Asset 29_pl2t.png"
                            alt="Page 3/3"
                            style="position:absolute;right:2%;top:calc(10% + 10px);width:59%;height:auto;z-index:5;">
                        <!-- Progress indicator: Asset 30 -->
                        <img src="Element 2-20260302T033547Z-1-001/Element 2/PILLAR 2/Tablet/Asset 30_pl2t.png"
                            alt="Progress"
                            style="position:absolute;right:24.5%;bottom:calc(11% + 105px);width:12%;height:auto;z-index:6;">
                    </div>

                </div>
            </div>
        </div>

        <!-- Navigation bar with Asset 16tab background -->

            <div class="nav-pill">
                <img src="Button-20260225T045112Z-1-001/Button/Asset 18.png" class="nav-pill-bg" alt="">

        <div style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;">
            <div class="thrive-canvas" style="position:relative;width:100%;height:100%;">

                        <img src="Element 2-20260302T033547Z-1-001/Element 2/PILLAR 4/Tab/Asset 36_pl4t.png"
