<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIAGNOSTIC</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: red;
            overflow: hidden;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: blue;
            opacity: 0;
            visibility: hidden;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Override just like main CSS */
        .bg {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
        }
    </style>
</head>

<body>
    <p style="color:white;font-size:30px;z-index:999;position:relative;">DIAGNOSTIC - CSS is loading</p>
    <div class="page active" style="opacity:1;visibility:visible;">
        <img class="bg" src="Element 2-20260302T033547Z-1-001/Element 2/GIF LOADING/tablet/Asset 8_tab.png" alt="bg">
        <p
            style="color:lime;font-size:40px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;">
            IMAGE SHOULD SHOW BEHIND THIS TEXT</p>
    </div>
</body>

</html>
